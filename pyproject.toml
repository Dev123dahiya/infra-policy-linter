[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "infra-policy-linter"
version = "0.1.0"
description = "Catch risky container and Kubernetes settings before deploy: a Dockerfile and manifest linter with 18 rules, line numbers, suppressions and a CI exit code"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["policylint"]
